version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/ansible_js
      - PORT=3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - ansible_network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ansible_network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=test
      - MONGODB_URI=mongodb://mongodb:27017/ansible_js_test
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - ansible_network

networks:
  ansible_network:
    driver: bridge

volumes:
  mongodb_data:
